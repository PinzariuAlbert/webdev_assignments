<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter</title>
    
</head>
<body>
    <script>
        let name = prompt("What is your name!");
        let number = Math.floor(Math.random() * 4);
        let textthing = document.createElement("h1");
switch(number){
    case 0:
         textthing.innerText=name +" you are a Gryffindor!!";
         break;
    case 1:
         textthing.innerText=name +" you are a Slytherin!!";
         break;
    case 2:
         textthing.innerText=name +" you are a Hufflepuff!!";
         break;
    case 3:
         textthing.innerText=name +" you are a Ravenclaw!!";
         break;
}
document.body.appendChild(textthing);
    </script>
</body>
</html>

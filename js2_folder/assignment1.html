<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1>Prime numbers</h1>
</head>
<body>
    <p id="rezult"></p>
      <script>
        const num= parseInt(prompt("Enter a number!!"));
        let isPrime= true;
        if (isNaN(num) || num <= 1)
         {
            isPrime = false;
         } 
        else
        {
            for (let i = 2; i <= Math.sqrt(num); i++)
            {
                if (num % i === 0)
                {
                    isPrime = false;
                    break;
                }
            }
        }
        const result = document.getElementById("rezult");
        if (isPrime)
        {
            result.textContent=`${num} is a prime number!!`;
        }
        else
        {
            result.textContent=`${num} is not a prime number :<`;
        }
    </script>
</body>
</html>
